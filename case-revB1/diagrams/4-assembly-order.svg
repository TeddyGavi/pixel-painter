<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="360" viewBox="0 0 1180 360"><defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#c00"/></marker></defs><rect width="1180" height="360" fill="white"/><text x="20.0" y="32.0" font-family="DejaVu Sans, Arial" font-size="20" text-anchor="start" fill="#111" font-weight="bold">4 · Order of assembly (cable part)</text>
<rect x="20.0" y="50.0" width="270.0" height="295.0" fill="#fafafa" fill-opacity="1" stroke="#bbb" stroke-width="0.8"/>
<text x="30.0" y="74.0" font-family="DejaVu Sans, Arial" font-size="15" text-anchor="start" fill="#111" font-weight="bold">A. Cable into J1</text>
<rect x="40.0" y="190.0" width="230.0" height="15.0" fill="#2f8f4a" fill-opacity="1" stroke="#000" stroke-width="0.8"/>
<rect x="170.0" y="175.0" width="50.0" height="15.0" fill="#d9d9d9" fill-opacity="1" stroke="#000" stroke-width="0.8"/>
<polyline points="215.0,182.0 280.0,182.0" fill="none" stroke="#c58b00" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="30.0" y="250.0" font-family="DejaVu Sans, Arial" font-size="12" text-anchor="start" fill="#111">Control PCB and Waveshare are</text>
<text x="30.0" y="264.4" font-family="DejaVu Sans, Arial" font-size="12" text-anchor="start" fill="#111">already screwed in.</text>
<text x="30.0" y="278.8" font-family="DejaVu Sans, Arial" font-size="12" text-anchor="start" fill="#111">Open the J1 latch, push the</text>
<text x="30.0" y="293.2" font-family="DejaVu Sans, Arial" font-size="12" text-anchor="start" fill="#111">cable in, close the latch.</text>
<text x="30.0" y="307.6" font-family="DejaVu Sans, Arial" font-size="12" text-anchor="start" fill="#111">The free end points to the</text>
<text x="30.0" y="322.0" font-family="DejaVu Sans, Arial" font-size="12" text-anchor="start" fill="#111">top of the device.</text>
<rect x="310.0" y="50.0" width="270.0" height="295.0" fill="#fafafa" fill-opacity="1" stroke="#bbb" stroke-width="0.8"/>
<text x="320.0" y="74.0" font-family="DejaVu Sans, Arial" font-size="15" text-anchor="start" fill="#111" font-weight="bold">B. Other end into J2</text>
<rect x="330.0" y="190.0" width="140.0" height="15.0" fill="#2f8f4a" fill-opacity="1" stroke="#000" stroke-width="0.8"/>
<rect x="400.0" y="175.0" width="50.0" height="15.0" fill="#d9d9d9" fill-opacity="1" stroke="#000" stroke-width="0.8"/>
<path d="M445,182 L480,182 A40,40 0 0 0 480,102 L460,102" fill="none" stroke="#c58b00" stroke-width="4" stroke-linecap="round"/>
<rect x="450.0" y="80.0" width="120.0" height="12.0" fill="#1f6f8f" fill-opacity="1" stroke="#000" stroke-width="0.8"/>
<rect x="460.0" y="92.0" width="45.0" height="16.0" fill="#d9d9d9" fill-opacity="1" stroke="#000" stroke-width="0.8"/>
<text x="510.0" y="120.0" font-family="DejaVu Sans, Arial" font-size="11" text-anchor="start" fill="#111">J2 faces</text>
<text x="510.0" y="133.2" font-family="DejaVu Sans, Arial" font-size="11" text-anchor="start" fill="#111">down</text>
<text x="320.0" y="250.0" font-family="DejaVu Sans, Arial" font-size="12" text-anchor="start" fill="#111">Hold the adapter above, J2</text>
<text x="320.0" y="264.4" font-family="DejaVu Sans, Arial" font-size="12" text-anchor="start" fill="#111">side down, header pins away.</text>
<text x="320.0" y="278.8" font-family="DejaVu Sans, Arial" font-size="12" text-anchor="start" fill="#111">Push the cable into J2 and</text>
<text x="320.0" y="293.2" font-family="DejaVu Sans, Arial" font-size="12" text-anchor="start" fill="#111">close its latch.</text>
<text x="320.0" y="307.6" font-family="DejaVu Sans, Arial" font-size="12" text-anchor="start" fill="#111">Check: no twist in the cable.</text>
<rect x="600.0" y="50.0" width="270.0" height="295.0" fill="#fafafa" fill-opacity="1" stroke="#bbb" stroke-width="0.8"/>
<text x="610.0" y="74.0" font-family="DejaVu Sans, Arial" font-size="15" text-anchor="start" fill="#111" font-weight="bold">C. Fold and press into J8</text>
<rect x="620.0" y="190.0" width="120.0" height="15.0" fill="#2f8f4a" fill-opacity="1" stroke="#000" stroke-width="0.8"/>
<rect x="680.0" y="175.0" width="50.0" height="15.0" fill="#d9d9d9" fill-opacity="1" stroke="#000" stroke-width="0.8"/>
<path d="M725,182 L765,182 A6,6 0 0 0 765,170 L715,170 A9,9 0 0 1 715,152 L750,152" fill="none" stroke="#c58b00" stroke-width="4" stroke-linecap="round"/>
<rect x="745.0" y="145.0" width="30.0" height="13.0" fill="#d9d9d9" fill-opacity="1" stroke="#000" stroke-width="0.8"/>
<rect x="730.0" y="158.0" width="130.0" height="10.0" fill="#1f6f8f" fill-opacity="1" stroke="#000" stroke-width="0.8"/>
<rect x="750.0" y="168.0" width="100.0" height="10.0" fill="#555" fill-opacity="1" stroke="#000" stroke-width="0.8"/>
<rect x="750.0" y="178.0" width="100.0" height="17.0" fill="#222" fill-opacity="1" stroke="#000" stroke-width="0.8"/>
<polyline points="800.0,120.0 800.0,140.0" fill="none" stroke="#c00" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="610.0" y="250.0" font-family="DejaVu Sans, Arial" font-size="12" text-anchor="start" fill="#111">Flip the adapter over the</text>
<text x="610.0" y="264.4" font-family="DejaVu Sans, Arial" font-size="12" text-anchor="start" fill="#111">cable so it lands header-down</text>
<text x="610.0" y="278.8" font-family="DejaVu Sans, Arial" font-size="12" text-anchor="start" fill="#111">on J8: the cable folds into</text>
<text x="610.0" y="293.2" font-family="DejaVu Sans, Arial" font-size="12" text-anchor="start" fill="#111">an S by itself.</text>
<text x="610.0" y="307.6" font-family="DejaVu Sans, Arial" font-size="12" text-anchor="start" fill="#111">Pin 1 to the TOP (keys end).</text>
<text x="610.0" y="322.0" font-family="DejaVu Sans, Arial" font-size="12" text-anchor="start" fill="#111">Press the adapter fully home.</text>
<rect x="890.0" y="50.0" width="270.0" height="295.0" fill="#fafafa" fill-opacity="1" stroke="#bbb" stroke-width="0.8"/>
<text x="900.0" y="74.0" font-family="DejaVu Sans, Arial" font-size="15" text-anchor="start" fill="#111" font-weight="bold">D. Battery, then close</text>
<rect x="910.0" y="120.0" width="230.0" height="15.0" fill="#9a9aa6" fill-opacity="1" stroke="#000" stroke-width="0.8"/>
<rect x="930.0" y="135.0" width="20.0" height="20.0" fill="#9a9aa6" fill-opacity="1" stroke="#000" stroke-width="0.8"/>
<rect x="1040.0" y="135.0" width="20.0" height="25.0" fill="#9a9aa6" fill-opacity="1" stroke="#000" stroke-width="0.8"/>
<rect x="1010.0" y="160.0" width="110.0" height="10.0" fill="#1f6f8f" fill-opacity="1" stroke="#000" stroke-width="0.8"/>
<rect x="920.0" y="150.0" width="80.0" height="50.0" fill="#4a64c8" fill-opacity="1" stroke="#000" stroke-width="0.8"/>
<polyline points="1025.0,95.0 1025.0,115.0" fill="none" stroke="#c00" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="900.0" y="250.0" font-family="DejaVu Sans, Arial" font-size="12" text-anchor="start" fill="#111">Battery taped on beside J8.</text>
<text x="900.0" y="264.4" font-family="DejaVu Sans, Arial" font-size="12" text-anchor="start" fill="#111">Back shell on: its ribs</text>
<text x="900.0" y="278.8" font-family="DejaVu Sans, Arial" font-size="12" text-anchor="start" fill="#111">press the adapter into J8.</text>
<text x="900.0" y="293.2" font-family="DejaVu Sans, Arial" font-size="12" text-anchor="start" fill="#111">2x M2x12 at the top,</text>
<text x="900.0" y="307.6" font-family="DejaVu Sans, Arial" font-size="12" text-anchor="start" fill="#111">2x M2x14 at H1/H2.</text></svg>