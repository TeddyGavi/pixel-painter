<!doctype html>
<!-- Source of og.png, the link-preview card. Regenerate (1200x630) with:
     chromium --headless=new --hide-scrollbars --window-size=1200,630 --screenshot=og.png og-card.html
     (serve this folder over http first so the font loads).
     Look: small gingham-check bead charms in muted colours laid on
     plain linen, on cream (--tint in index.html is the same colour). -->
<html><head><meta charset="utf-8">

<style>
  @font-face { font-family: "Chicago"; src: url("ChicagoKare-Regular.woff2"); }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: #f5edda; color: #141412; font-family: "Chicago"; display: flex; align-items: center;
         gap: 72px; padding: 0 64px 0 72px; box-sizing: border-box; -webkit-font-smoothing: none; }
  .win { background: #fffaf0; border: 4px solid #141412; box-shadow: 10px 10px 0 #141412; flex: none; }
  .bar { height: 40px; border-bottom: 4px solid #141412; display: flex; align-items: center; justify-content: center;
         background: repeating-linear-gradient(#fffaf0 0 6px, #141412 6px 8px); background-clip: content-box; padding: 7px; }
  .bar b { background: #fffaf0; padding: 0 14px; font: 32px "Chicago"; font-weight: normal; }
  canvas { display: block; width: 432px; height: 432px; }
  h1 { font: 96px/1 "Chicago"; margin: 0 0 32px; font-weight: normal; }
  p { font-size: 32px; line-height: 1.5; margin: 0; color: #3c3d36; }
</style></head>
<body>
  <div class="win"><div class="bar"><b>charms.bead</b></div><canvas id="c" width="432" height="432"></canvas></div>
  <div>
    <h1>Pixel<br>Painting</h1>
    <p>Made on a pixel painter</p>
  </div>
<script>
const x = document.getElementById("c").getContext("2d"), S = 432;

// Plain linen: oat with a faint weave.
x.fillStyle = "#ece2cc"; x.fillRect(0, 0, S, S);
x.fillStyle = "rgba(120,95,50,.05)";
for (let k = 0; k < S; k += 4) { x.fillRect(k, 0, 2, S); x.fillRect(0, k, S, 2); }

// Charms, one char per bead. Bottle charms: '#' takes a gingham colour from its position.
const BOTTLE = ["..##..", "..##..", ".####.", "######", "######", "######", "######", "######", "######"];
// Gingham colours [both stripes, one stripe, plain], muted to sit on the oat linen.
const CREAM = "#fbf6ea";
const GING = {
  rose:     ["#d36f7c", "#ecaeb3", CREAM],
  clay:     ["#c46c48", "#e4aa8b", CREAM],
  mustard:  ["#d4a23a", "#ebcf8b", CREAM],
  sage:     ["#76a073", "#b6cfac", CREAM],
  blue:     ["#6a90b4", "#adc5dc", CREAM],
  lavender: ["#957fb6", "#c9badb", CREAM],
};
const P = 14;   // bead pitch

function bead(cx, cy, col) {
  const r = 6.4;
  x.fillStyle = col; x.beginPath(); x.roundRect(cx - r, cy - r, 2 * r, 2 * r, 3.2); x.fill();
  x.strokeStyle = "rgba(0,0,0,.16)"; x.lineWidth = 1; x.stroke();
}
function charm(rows, colOf, ox, oy, rot) {
  const w = rows[0].length * P, h = rows.length * P;
  x.save(); x.translate(ox, oy); x.rotate(rot * Math.PI / 180); x.translate(-w / 2, -h / 2);
  // soft shadow on the cloth, then the jump ring, then the beads
  x.fillStyle = "rgba(80,60,30,.22)";
  rows.forEach((row, j) => [...row].forEach((ch, i) => {
    if (ch !== ".") { x.beginPath(); x.roundRect(i * P + 3, j * P + 4, P, P, 4); x.fill(); }
  }));
  const top = rows[0].replace(/\./g, ""), ringX = (rows[0].indexOf(top[0]) + top.length / 2) * P;
  x.strokeStyle = "#c79a3a"; x.lineWidth = 3; x.beginPath(); x.arc(ringX, -7, 7, 0, 7); x.stroke();
  rows.forEach((row, j) => [...row].forEach((ch, i) => {
    if (ch !== ".") bead(i * P + P / 2, j * P + P / 2, colOf(ch, i, j));
  }));
  x.restore();
}
const gingham = g => (ch, i, j) => g[2 - ((i & 1) + (j & 1))];

charm(BOTTLE, gingham(GING.lavender),  84, 112, -8);
charm(BOTTLE, gingham(GING.clay),     210, 104,  6);
charm(BOTTLE, gingham(GING.mustard),  340, 114, -4);
charm(BOTTLE, gingham(GING.sage),      84, 310,  5);
charm(BOTTLE, gingham(GING.blue),     210, 322, -6);
charm(BOTTLE, gingham(GING.rose),     344, 306,  8);
</script>
</body></html>
